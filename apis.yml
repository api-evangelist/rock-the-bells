apis:
- aid: rock-the-bells-commerce-mcp
  name: Rock The Bells Commerce MCP Server (UCP)
  description: >-
    A live, remote Model Context Protocol server on Rock The Bells' own storefront host implementing
    the Universal Commerce Protocol shopping service. Thirteen tools let an agent search the catalog,
    look up and retrieve products, build and cancel a cart, and create, update, complete or cancel a
    checkout, plus retrieve an order. Every tool carries a complete JSON Schema 2020-12 inputSchema,
    enumerated anonymously — no API key, no OAuth challenge. Completing payment requires
    contemporaneous human buyer approval, which the store states in both llms.txt and robots.txt.
  humanURL: https://shop.rockthebells.com/llms.txt
  baseURL: https://shop.rockthebells.com/api/ucp/mcp
  tags:
  - MCP
  - Agentic Commerce
  - Checkout
  - Catalog
  properties:
  - type: MCPServer
    url: mcp/rock-the-bells-mcp.yml
  - type: ToolCrosswalk
