  - type: WellKnown
    url: well-known/rock-the-bells-well-known.yml
  - type: JSONSchema
    url: json-schema/rock-the-bells-ucp-tool-schemas.json
  - type: Documentation
    url: https://shop.rockthebells.com/llms.txt
- aid: rock-the-bells-storefront-graphql
  name: Rock The Bells Storefront GraphQL API
  description: >-
    The Shopify Storefront GraphQL API as served on Rock The Bells' own domain. Full introspection
    succeeded anonymously on 2026-08-26, returning a 414-type schema with 34 root query fields and 41
    mutations covering products, variants, collections, carts, customer accounts, blogs, articles,
    pages and Shop Pay payment request sessions. Dated calendar versioning in the URL path; every
    response carries an extensions.cost query budget.
  humanURL: https://shop.rockthebells.com/llms.txt
  baseURL: https://shop.rockthebells.com/api/2026-07/graphql.json
