aid: rock-the-bells
name: Rock The Bells
description: >-
  Rock The Bells is the hip-hop culture brand and direct-to-consumer merchandise retailer founded by
  LL COOL J, describing itself on its own storefront as "The Home For All Things Classic and Timeless
  Hip-Hop". It sells apparel and accessories and publishes editorial across five blogs (features,
  artists, videos, From Jamaica to the Bronx, and COHH). It ships no developer program and no
  OpenAPI, but it does serve a live, anonymously callable agent commerce surface: a Universal
  Commerce Protocol (UCP 2026-04-08) merchant profile at /.well-known/ucp, a 13-tool Model Context
  Protocol server at /api/ucp/mcp, a fully introspectable Storefront GraphQL API, and an agent
  instruction document at /llms.txt and /agents.md that its robots.txt and a purpose-built
  sitemap_agentic_discovery.xml both point at. Discovery is open; payment is gated by a stated
  human-approval invariant rather than by a credential.
