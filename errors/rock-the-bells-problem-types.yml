description: >-
  Error catalog derived from the live Storefront GraphQL schema and the live MCP tool manifest. This
  is not RFC 9457 — the surface uses typed GraphQL UserError objects returned inside a 200 response,
  plus JSON-RPC error envelopes on MCP. The enumerated codes below are read verbatim from the
  introspected schema, so they are the real codes a client will receive.
format: graphql-user-errors
rfc9457: false
envelope:
  graphql:
    location: mutation payload (not HTTP status)
    http_status_on_error: 200
    interface: DisplayableError
    interface_fields:
    - field
    - message
    note: >-
      Typed error objects implement DisplayableError, and the richer ones add a `code` enum. A client
      must inspect the payload; the HTTP status is not the signal.
  mcp:
    style: JSON-RPC 2.0
    location: response.error
  http:
    '404': Storefront returns an HTML 404 page for unknown paths.
    '429': Documented on the MCP endpoint; back off.
error_types:
- name: CartUserError
  fields: [code, field, message]
  code_enum: CartErrorCode
  codes: [INVALID, LESS_THAN, INVALID_MERCHANDISE_LINE, MERCHANDISE_NOT_APPLICABLE, MISSING_DISCOUNT_CODE, MISSING_NOTE, NOTE_TOO_LONG, INVALID_DELIVERY_GROUP, INVALID_DELIVERY_OPTION, PENDING_DELIVERY_GROUPS, INVALID_PAYMENT, PAYMENT_METHOD_NOT_SUPPORTED, PAYMENT_METHOD_NOT_APPLICABLE, INVALID_PAYMENT_DEFERRED_PAYMENT_REQUIRED]
  applies_to: cart mutations
- name: CartOperationError
  fields: [code, message]
  applies_to: cart operations
- name: CompletionError
  fields: [code, message]
  code_enum: CompletionErrorCode
  codes: [ERROR, INVENTORY_RESERVATION_ERROR, PAYMENT_ERROR, PAYMENT_TRANSIENT_ERROR, PAYMENT_AMOUNT_TOO_SMALL, PAYMENT_GATEWAY_NOT_ENABLED_ERROR, PAYMENT_INSUFFICIENT_FUNDS, PAYMENT_INVALID_PAYMENT_METHOD, PAYMENT_INVALID_CURRENCY, PAYMENT_INVALID_CREDIT_CARD, PAYMENT_INVALID_BILLING_ADDRESS, PAYMENT_CARD_DECLINED, PAYMENT_CALL_ISSUER]
  applies_to: cart completion / payment
  agent_note: >-
    PAYMENT_TRANSIENT_ERROR is the one code in this set that is safe to retry. The remaining PAYMENT_*
