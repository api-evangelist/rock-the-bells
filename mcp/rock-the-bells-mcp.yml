name: Rock The Bells Commerce MCP Server (UCP)
description: Rock The Bells serves a live, anonymously-listable Model Context Protocol server on its own
  storefront host at https://shop.rockthebells.com/api/ucp/mcp. It implements the Universal Commerce Protocol
  (UCP) shopping service, exposing 13 tools that let an agent search the Rock The Bells catalog, build
  a cart, and drive a checkout to completion. The endpoint is advertised by the store's own /llms.txt,
  /agents.md and /robots.txt.
status: published
deployment:
  mode: remote
  endpoint: https://shop.rockthebells.com/api/ucp/mcp
  install: null
  package: null
  auth: none
  verified: probed
  note: 'An unauthenticated POST of {"jsonrpc":"2.0","id":1,"method":"tools/list"} returned HTTP 200 with
    the full 13-tool manifest including complete inputSchema for every tool (52,007 bytes, saved verbatim
    to mcp/rock-the-bells-mcp-tools.json). No API key, OAuth challenge or storefront token was required
    to enumerate the tool surface. Payment completion is a separate matter: the store''s own agent instructions
    require contemporaneous human buyer approval before any checkout is completed, so `auth: none` describes
    DISCOVERY, not authorization to transact.'
ownership:
  verified: true
  evidence: The MCP endpoint is served from shop.rockthebells.com, a host Rock The Bells controls (DNS
    CNAME to rock-the-bells.myshopify.com). The store's own Storefront GraphQL API reports shop.name =
    "Rock The Bells" and shop.primaryDomain.url = "https://shop.rockthebells.com", and every product in
    /products.json carries vendor "Rock The Bells". The MCP server itself is Shopify-native infrastructure
    (Shopify implements UCP for every store), so the PROTOCOL and tool shapes are Shopify's, while the
    CATALOG, cart, checkout and order data the tools operate on are Rock The Bells'. Recorded here as
    a real agent surface the company serves, not as a bespoke API Rock The Bells engineered.
