description: >-
  Binding between the 13 UCP/MCP tools Rock The Bells serves and the Storefront GraphQL operations
  that back the same capability. There is NO OpenAPI on this provider — every REST probe
  (/openapi.json, /openapi.yaml, /swagger.json, /api-docs) returned 404 — so the `rest` column is
  empty on every row by fact, not by omission, and the real crosswalk is MCP tool -> GraphQL field.
  Both surfaces were enumerated anonymously, so these are real names on both sides; what is DERIVED
  is the semantic pairing between them, and confidence is set accordingly.
surfaces:
  openapi:
    present: false
    note: >-
      Probed https://shop.rockthebells.com/openapi.json, /openapi.yaml, /swagger.json, /api-docs and
